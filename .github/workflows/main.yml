name: Update BTC Fear & Greed data
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '2,12,22,32,42,52 22,23 * * *'
    - cron: '2,12,22,32,42,52 0 * * *'
permissions:
  contents: write
concurrency:
  group: btc-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 245
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Coinbase UTC daily opens and Alternative.me readings
        run: python .github/workflows/update_data.py
      - name: Commit updated dashboard if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Coinbase and Fear & Greed daily data'
            git push
          fi
