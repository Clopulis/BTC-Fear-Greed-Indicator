
name: Update BTC Fear & Greed data



on:
  schedule:
    - cron: '20 0,3 * * *'
  workflow_dispatch:



permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Coinbase and Fear & Greed data
        run: python .github/workflows/update_data.py

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update BTC and Fear & Greed daily data"
            git push
          fi
          
