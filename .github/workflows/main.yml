name: Update BTC Fear & Greed data
on:
  workflow_dispatch:
  schedule:
    - cron: '1,5,15,30 0 * * *'
    - cron: '0 1,2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh completed Coinbase UTC daily opens and Alternative.me readings
        run: python .github/workflows/update_data.py
      - name: Commit updated dashboard if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Coinbase and Fear & Greed daily data'
            git push
          fi
